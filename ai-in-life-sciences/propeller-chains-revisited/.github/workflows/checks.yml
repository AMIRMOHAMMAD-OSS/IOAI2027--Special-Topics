name: Numerical checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-reproduce.txt
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m propeller_paths verify --out runs/ci_verify
