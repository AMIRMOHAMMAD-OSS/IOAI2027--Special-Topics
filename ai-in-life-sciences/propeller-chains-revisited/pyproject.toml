[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propeller-paths"
version = "0.1.0"
description = "Reproducible MMFF94 paths for a four-ring molecular propeller chain"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AmirMohammad MohammadHosseini"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "rdkit>=2024.9"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
propeller-paths = "propeller_paths.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propeller_paths = ["data/*.json", "data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
